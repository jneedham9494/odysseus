name: odysseus-mine
services:
  chromadb:
    ports: !reset []
  searxng:
    ports: !reset []
  ntfy:
    ports: !reset []
  # Dual-home onto the homelab network so the assistant can reach homelab
  # services by name (homeassistant:8123, miniflux:8080, adguard, plane, …).
  odysseus:
    networks:
      - default
      - homelab
      # Reach LiteLLM (litellm:4000) so the "LiteLLM (traced)" endpoint works and
      # assistant LLM calls flow through Langfuse.
      - ai_default
networks:
  homelab:
    external: true
  ai_default:
    external: true
